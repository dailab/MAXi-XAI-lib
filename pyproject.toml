[tool.poetry]
name = "maxi"
version = "0.5.2"
description = "Model-Agnostic Explanation Library"
authors = ["Tuan Anh, Le <tuananh.le@dai-labor.de>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
pyyaml = "^6.0"
matplotlib = "^3.4.2"
numba = "^0.67.0"
opencv-python = "^4.5.4"
scikit-image = "^0.26.0"
torch = "^2.0.1"
numpy = "^2.0.0"
nptyping = "^2.0.0"
torchvision = "^0.29.0"
tensorflow = "^2.12.0"

[tool.poetry.dev-dependencies]
black = "^21.11b1"
pdoc3 = "^0.11.0"
jupyter = "^1.0.0"
ipython = "<9.17.2"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
